[project]
name = "skilldeck"
version = "0.1.0"
description = "Git-native agent skill management: share, install, and evaluate agent skills"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
skill = "skilldeck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]
